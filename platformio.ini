; RNode firmware port for Arduino Nesso N1 (M5Stack / Arduino)
; ESP32-C6 + SX1262, 1.14" ST7789 240x135 landscape display
;
; Build with:  pio run -e nesso_n1
; Upload with: pio run -e nesso_n1 -t upload

[platformio]
src_dir = .

[env:nesso_n1]
platform = espressif32
board = arduino_nesso_n1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  rweather/Crypto@^0.4.0
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
lib_ignore =
  SD
build_flags =
  -DBOARD_MODEL=0x43
  -DMODEM=0x03
build_src_filter =
  +<*>
  -<Console/>
  -<Builds/>
  -<Documentation/>
  -<Release/>
  -<.github/>
  -<.git/>
  -<build/>
